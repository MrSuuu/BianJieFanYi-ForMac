name: Release

# 打 tag 就自动发 Release，并把对应版本的发布包挂上去。
# 为什么用 Actions 的 GITHUB_TOKEN 而不是本机操作：
#   本机没有 gh CLI、也没有 Personal Access Token，GitHub 的建仓/发 Release 接口
#   都必须带 token；而 Actions 运行时 GitHub 会自动注入 secrets.GITHUB_TOKEN，
#   所以"发 Release"这件事交给 CI 做，本机只需要 git push（SSH key 就够）。
#
# 发布新版本的完整流程：
#   1. 本地改代码 → APP_VERSION 加一
#   2. bash package.sh                    # 打出 dist/Yi-macOS-<版本>.zip
#   3. git add -A && git commit && git push
#   4. git tag v<版本> && git push origin v<版本>   # ← 这一步触发本工作流

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # 也允许在 Actions 页面手动跑一次

permissions:
  contents: write           # 发 Release 需要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验发布包存在
        run: |
          # tag 名 v3.2 → 版本号 3.2 → 找 dist/ 里任意 *macOS-3.2.zip
          # 用通配符而不是写死文件名：应用改过名（Yi → BianJieFanYi），
          # 写死的话每次改名都得回来改工作流，一不留神就是一次红的失败。
          VER="${GITHUB_REF_NAME#v}"
          ZIP="$(ls dist/*macOS-$VER.zip 2>/dev/null | head -1)"
          if [ -z "$ZIP" ]; then
            echo "::error::找不到 dist/*macOS-$VER.zip —— 请先在本地跑 'bash package.sh' 并把产物提交上来"
            echo "当前 dist/ 内容："; ls -l dist/ || true
            exit 1
          fi
          echo "找到发布包：$ZIP ($(du -h "$ZIP" | cut -f1))"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: 发 Release（幂等：已存在就更新，不报错）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(cat <<'TXT'
          ## 安装

          1. 下载下面的 **BianJieFanYi-*.zip**
          2. 解压，双击 **「安装.command」**（会装到「应用程序」并自动解除 Gatekeeper 隔离）
          3. 打开后在**菜单栏右上角**找那个「译」字方块图标，或按 `⌥Space` 呼出

          > 首次使用「选区浮窗」需要到 **系统设置 → 隐私与安全性 → 辅助功能** 给「便捷翻译」打勾。

          详细说明见 [README](https://github.com/MrSuuu/Yi-macOS#readme)。
          TXT
          )
          TITLE="便捷翻译 $GITHUB_REF_NAME"
          # gh release view 查不到「draft」状态的 release，但以同名 tag 创建时又会冲突
          # （推送 annotated tag 时 GitHub 有时会先自动建一个 release）。
          # 所以这里做双保险：先试 view→edit，不行就 create，create 再失败就回头 edit 并强制发布。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # 已存在（比如改了文案后重推 tag 刷新）→ 更新标题/说明，并覆盖附件
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes "$NOTES" --draft=false
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          elif ! gh release create "$GITHUB_REF_NAME" "$ZIP" \
                 --title "$TITLE" --notes "$NOTES" --generate-notes; then
            # create 失败：极可能是已存在同名 release（含 draft，view 看不到）
            echo "::warning::create 失败，改用 edit 并强制发布"
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes "$NOTES" --draft=false
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          fi
          echo "✓ Release $GITHUB_REF_NAME 已就绪"
          gh release view "$GITHUB_REF_NAME" --json name,isDraft,assets \
            --template '{{.name}} draft={{.isDraft}} 附件={{range .assets}}{{.name}} {{end}}{{"\n"}}'
